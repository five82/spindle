version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Preserve Flyer's additional checks without expanding migration scope.
      - path-except: ^flyer/
        linters:
          - gocritic
          - misspell
      - path: ^flyer/.*_test\.go
        linters:
          - errcheck
  settings:
    gocritic:
      disabled-checks:
        - appendAssign
        - ifElseChain
        - unlambda

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^cmd/
      - ^internal/
      - ^reel/
  settings:
    goimports:
      local-prefixes:
        - github.com/five82/spindle

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
